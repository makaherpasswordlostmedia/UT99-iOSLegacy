name: Build Unreal Tournament 99 (iOS armv7, iOS 7+)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Stage sources (repo ut99dc + SDL2 2.32.10 + libxmp) and unpack the iOS host payload
        run: |
          set -euo pipefail
          test -d third_party/ut99dc/Source
          test -d app/src/main/cpp/android_glad_compat
          mkdir -p engine build_deps ios/cmake ios/scripts ios/shim/android
          cp -r third_party/ut99dc/Source engine/Source
          cp -r app/src/main/cpp/android_glad_compat android_glad_compat
          cp -r app/src/main/cpp/android_glm_compat android_glm_compat
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz | tar -xz -C build_deps
          mv build_deps/SDL2-2.32.10 build_deps/SDL2
          git clone --depth 1 --branch libxmp-4.6.3 https://github.com/libxmp/libxmp.git build_deps/libxmp || git clone --depth 1 https://github.com/libxmp/libxmp.git build_deps/libxmp
