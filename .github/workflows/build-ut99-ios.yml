          # ios_diag.mm is kept here in plain text (edit THIS yml); it overrides the copy inside the payload above
          cat > ios/host/ios_diag.mm <<'EOF_DIAG'
          // ios_diag.mm - persistent log + crash/exception/hang diagnostics for the iOS host.
          //
          // Everything goes to <App>/Documents/ut99_ios.log (and NSLog for host messages):
          //   [host]   host/launcher messages (UE1IOSLog)
          //   [engine] every engine debugf()/appError() line, mirrored from FOutputDeviceFile (UE1IOSLogTagged)
          //   [launch] the Launch.cpp checkpoints (appInit / InitEngine / main loop ...) and other __android_log_print users
          //   [sdl]    SDL_Log messages, with category + priority names
          //   [life]   app lifecycle + memory warnings (the usual reason an old iPad silently dies while loading)
          //   [hb]     heartbeat: silent time, CPU %, resident memory, main-loop liveness and a hang/busy verdict
          //   [hang]   when silent >= 3 s: 3 samples of the main thread's call stack (function+offset) = where it is stuck
          //   [CRASH]  fatal signals / uncaught exceptions / std::terminate, with backtrace and the last log line
          //
          // Session handling:
          //   * every line is "[HH:MM:SS.mmm +T.TTs] tag  message" (T = seconds since process start)
          //   * multi-line messages are flattened to ONE line (the old log split them into broken, untimestamped lines)
          //   * a marker file Documents/.ut99_running tells the NEXT launch how the previous one ended:
          //     clean exit / crash (report is in the log) / killed without a trace (jetsam, watchdog, force-quit)
          //   * the log is rotated to ut99_ios.log.old when it grows past 2 MB
          #ifdef __OBJC__
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #endif
          #ifndef UE_DIAG_TEST
          #include <SDL2/SDL.h>
          #endif
          #include <execinfo.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <signal.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <unistd.h>
          #include <sys/stat.h>
          #include <sys/time.h>
          #include <sys/resource.h>
          #include <exception>
          #ifdef __APPLE__
          #include <mach/mach.h>
          #include <sys/sysctl.h>
          #include <dlfcn.h>
          #include <mach-o/dyld.h>
          #include <sys/ucontext.h>
          #endif
          #ifndef __APPLE__
          #define strlcpy( D, S, N ) ( snprintf( (D), (N), "%s", (S) ) )
          #endif

          extern "C" const char* UE1IOSDocumentsDir( void );

          static int GFd = -1;
          static int GOpenTried = 0;
          static pthread_mutex_t GLock = PTHREAD_MUTEX_INITIALIZER;
          static char GLast[256] = "(nothing logged yet)";
          static double GLastAt = 0;              // wall time of the last non-heartbeat line
          static double GStart = 0;               // process start (diag constructor)
          static volatile double GMainPumpAt = 0; // last time the main queue ran = the main thread pumped its run loop
          static char GMarker[1120] = "";
          static char GLogPath[1120] = "";

          static double NowSec( void )
          {
          	struct timeval Tv; gettimeofday( &Tv, NULL );
          	return (double)Tv.tv_sec + (double)Tv.tv_usec * 1e-6;
          }

          static void RawWrite( const char* S )
          {
          	if( GFd < 0 || !S ) return;
          	size_t N = strlen( S );
          	while( N )
          	{
          		ssize_t W = write( GFd, S, N );
          		if( W <= 0 ) break;
          		S += W; N -= (size_t)W;
          	}
          }

          // Resident memory of the process in MB (old iPads are killed around 100-250 MB).
          static unsigned ResidentMB( void )
          {
          #ifdef __APPLE__
          	task_basic_info_data_t Info; mach_msg_type_number_t Cnt = TASK_BASIC_INFO_COUNT;
          	if( task_info( mach_task_self(), TASK_BASIC_INFO, (task_info_t)&Info, &Cnt ) == KERN_SUCCESS )
          		return (unsigned)( (unsigned long long)Info.resident_size / ( 1024ull * 1024ull ) );
          	return 0;
          #else
          	long Pages = 0, Res = 0; FILE* F = fopen( "/proc/self/statm", "r" );
          	if( F ) { if( fscanf( F, "%ld %ld", &Pages, &Res ) != 2 ) Res = 0; fclose( F ); }
          	return (unsigned)( Res * 4096 / ( 1024 * 1024 ) );
          #endif
          }

          static double CpuSeconds( void )
          {
          	struct rusage Ru; if( getrusage( RUSAGE_SELF, &Ru ) != 0 ) return 0;
          	return (double)Ru.ru_utime.tv_sec + (double)Ru.ru_utime.tv_usec * 1e-6 + (double)Ru.ru_stime.tv_sec + (double)Ru.ru_stime.tv_usec * 1e-6;
          }

          // One log entry must stay ONE line: CR/LF -> " | ", other control chars -> '?'.
          static void Flatten( char* Dst, size_t Cap, const char* Src )
          {
          	size_t O = 0; bool Sep = false;
          	for( ; Src && *Src && O + 6 < Cap; Src++ )
          	{
          		unsigned char C = (unsigned char)*Src;
          		if( C == '\n' || C == '\r' ) { Sep = true; continue; }
          		if( C < 32 && C != '\t' ) C = '?';
          		if( Sep ) { if( O ) { Dst[O++] = ' '; Dst[O++] = '|'; Dst[O++] = ' '; } Sep = false; }
          		Dst[O++] = (char)C;
          	}
          	Dst[O] = 0;
          }

          static void EnsureOpen( void )
          {
          	if( GFd >= 0 || GOpenTried ) return;
          	GOpenTried = 1;
          	const char* Docs = UE1IOSDocumentsDir();
          	if( !Docs || !Docs[0] ) Docs = getenv( "TMPDIR" ); // Documents lookup failed: still try to leave a trace somewhere
          	if( !Docs || !Docs[0] ) Docs = "/tmp";
          	snprintf( GLogPath, sizeof(GLogPath), "%s/ut99_ios.log", Docs );
          	snprintf( GMarker, sizeof(GMarker), "%s/.ut99_running", Docs );
          	struct stat St;
          	if( stat( GLogPath, &St ) == 0 && St.st_size > 2 * 1024 * 1024 )
          	{
          		char Old[1200]; snprintf( Old, sizeof(Old), "%s.old", GLogPath );
          		rename( GLogPath, Old );
          	}
          	GFd = open( GLogPath, O_WRONLY | O_CREAT | O_APPEND, 0644 );
          }

          // Tag = short source name. Msg may contain newlines. UpdateLast=false for heartbeat/lifecycle noise.
          static void LogLine( const char* Tag, const char* Msg, bool UpdateLast )
          {
          	if( !Msg ) return;
          	char Flat[1300]; Flatten( Flat, sizeof(Flat), Msg );
          	pthread_mutex_lock( &GLock );
          	EnsureOpen();
          	struct timeval Tv; gettimeofday( &Tv, NULL );
          	time_t Sec = Tv.tv_sec; struct tm Tm; localtime_r( &Sec, &Tm );
          	char Ts[16]; strftime( Ts, sizeof(Ts), "%H:%M:%S", &Tm );
          	const double Since = GStart > 0 ? ( (double)Tv.tv_sec + (double)Tv.tv_usec * 1e-6 ) - GStart : 0.0;
          	char Line[1400];
          	snprintf( Line, sizeof(Line), "[%s.%03d +%7.2fs] %-6s %s\n", Ts, (int)( Tv.tv_usec / 1000 ), Since, Tag ? Tag : "?", Flat );
          	RawWrite( Line );
          	if( UpdateLast )
          	{
          		snprintf( GLast, sizeof(GLast), "%s: %.230s", Tag ? Tag : "?", Flat );
          		GLastAt = NowSec();
          	}
          	pthread_mutex_unlock( &GLock );
          }

          // Host/launcher messages (also to NSLog -> Xcode/idevicesyslog).
          extern "C" void UE1IOSLog( const char* Msg )
          {
          	LogLine( "host", Msg, true );
          #ifdef __OBJC__
          	if( Msg ) NSLog( @"[UT99] %s", Msg );
          #endif
          }

          // Engine / shim messages: file only (an NSLog per engine line would slow package loading on an A5 to a crawl).
          extern "C" void UE1IOSLogTagged( const char* Tag, const char* Msg )
          {
          	LogLine( Tag, Msg, true );
          }

          static void MarkerWrite( const char* State )
          {
          	if( !GMarker[0] ) return;
          	int Fd = open( GMarker, O_WRONLY | O_CREAT | O_TRUNC, 0644 );
          	if( Fd < 0 ) return;
          	char B[120]; int N = snprintf( B, sizeof(B), "%s pid=%d start=%ld\n", State, (int)getpid(), (long)GStart );
          	if( N > 0 ) { ssize_t W = write( Fd, B, (size_t)N ); (void)W; }
          	close( Fd );
          }

          // ---- Crash handler: strictly async-signal-safe (no snprintf/strsignal/backtrace/malloc: the previous version hung INSIDE the
          // handler and the crash report was never written). It prints signal, fault address and the registers of the crashed
          // code straight from the signal context, then asks the heartbeat thread to symbolize the stack (dladdr is not signal-safe).
          static volatile unsigned long GCrashPcs[20];
          static volatile int GCrashN = 0;
          static volatile int GCrashState = 0; // 0 idle, 1 = heartbeat thread please symbolize, 2 = done

          static char* PutS( char* P, const char* S ) { while( *S ) *P++ = *S++; return P; }
          static char* PutHex( char* P, unsigned long V )
          {
          	*P++ = '0'; *P++ = 'x'; int Started = 0;
          	for( int i = (int)sizeof(V) * 8 - 4; i >= 0; i -= 4 )
          	{ unsigned D = (unsigned)( ( V >> i ) & 15 ); if( D || Started || i == 0 ) { *P++ = "0123456789abcdef"[D]; Started = 1; } }
          	return P;
          }
          static char* PutDec( char* P, long V )
          {
          	char T[24]; int N = 0; unsigned long U = V < 0 ? 0UL - (unsigned long)V : (unsigned long)V;
          	if( V < 0 ) *P++ = '-';
          	do { T[N++] = (char)( '0' + U % 10 ); U /= 10; } while( U );
          	while( N ) *P++ = T[--N];
          	return P;
          }
          static const char* SigName( int S )
          {
          	switch( S ) { case SIGSEGV: return "SIGSEGV"; case SIGBUS: return "SIGBUS"; case SIGILL: return "SIGILL";
          		case SIGABRT: return "SIGABRT"; case SIGFPE: return "SIGFPE"; case SIGTRAP: return "SIGTRAP"; }
          	return "SIG?";
          }

          static void CrashHandler( int Sig, siginfo_t* Si, void* Ctx )
          {
          	static volatile int Entered = 0;
          	if( Entered++ ) { RawWrite( "*** CRASH: second fault inside the crash handler - exiting\n" ); _exit( 128 + Sig ); }
          	MarkerWrite( "crash" );
          	unsigned long Pc = 0, Lr = 0, Sp = 0, Fp = 0, Cpsr = 0;
          #if defined(__APPLE__) && defined(__arm__)
          	if( Ctx )
          	{
          		ucontext_t* Uc = (ucontext_t*)Ctx;
          		if( Uc->uc_mcontext ) { Pc = Uc->uc_mcontext->__ss.__pc; Lr = Uc->uc_mcontext->__ss.__lr; Sp = Uc->uc_mcontext->__ss.__sp; Fp = Uc->uc_mcontext->__ss.__r[7]; Cpsr = Uc->uc_mcontext->__ss.__cpsr; }
          	}
          #else
          	(void)Ctx;
          #endif
          	char B[700]; char* P = B;
          	P = PutS( P, "\n*** CRASH " ); P = PutS( P, SigName( Sig ) ); P = PutS( P, " (" ); P = PutDec( P, Sig );
          	P = PutS( P, ") code=" ); P = PutDec( P, Si ? Si->si_code : 0 );
          	P = PutS( P, " fault_addr=" ); P = PutHex( P, Si ? (unsigned long)Si->si_addr : 0 );
          	P = PutS( P, "\n*** pc=" ); P = PutHex( P, Pc ); P = PutS( P, " lr=" ); P = PutHex( P, Lr );
          	P = PutS( P, " sp=" ); P = PutHex( P, Sp ); P = PutS( P, " r7=" ); P = PutHex( P, Fp ); P = PutS( P, " cpsr=" ); P = PutHex( P, Cpsr );
          	P = PutS( P, " pid=" ); P = PutDec( P, (long)getpid() );
          #ifdef __APPLE__
          	P = PutS( P, " image_slide=" ); P = PutHex( P, (unsigned long)_dyld_get_image_vmaddr_slide( 0 ) );
          #endif
          	P = PutS( P, "\n*** last log line: " );
          	for( int i = 0; i < 255 && GLast[i]; i++ ) *P++ = ( GLast[i] == '\n' || GLast[i] == '\r' ) ? ' ' : GLast[i];
          	P = PutS( P, "\n" ); *P = 0;
          	RawWrite( B );

          	// Raw frames: pc, lr, then the r7 frame chain (read through vm_read_overwrite so a bad pointer cannot fault again).
          	int N = 0;
          	if( Pc ) GCrashPcs[N++] = Pc;
          	if( Lr ) GCrashPcs[N++] = Lr;
          #if defined(__APPLE__) && defined(__arm__)
          	for( int i = 0; i < 16 && N < 18 && Fp && !( Fp & 3 ); i++ )
          	{
          		unsigned long Frame[2]; vm_size_t Got = 0;
          		if( vm_read_overwrite( mach_task_self(), (vm_address_t)Fp, sizeof(Frame), (vm_address_t)Frame, &Got ) != KERN_SUCCESS || Got != sizeof(Frame) ) break;
          		if( Frame[1] ) GCrashPcs[N++] = Frame[1];
          		if( Frame[0] <= Fp ) break;
          		Fp = Frame[0];
          	}
          #endif
          	P = B; P = PutS( P, "*** raw frames:" );
          	for( int i = 0; i < N; i++ ) { P = PutS( P, " " ); P = PutHex( P, GCrashPcs[i] ); }
          	P = PutS( P, "\n" ); *P = 0;
          	RawWrite( B );

          	// Ask the heartbeat thread to symbolize (it is not the crashed thread); wait at most 3 s, then die for sure (no spinning).
          	GCrashN = N; GCrashState = 1;
          	for( int i = 0; i < 300 && GCrashState != 2; i++ ) usleep( 10000 );
          	RawWrite( "*** end of crash report\n" );
          	_exit( 128 + Sig );
          }

          static void TerminateHandler( void )
          {
          	static int Busy = 0;
          	if( !Busy )
          	{
          		Busy = 1;
          		MarkerWrite( "crash" );
          		char B[600];
          		try { throw; }
          		catch( const std::exception& E ) { snprintf( B, sizeof(B), "std::exception: %s", E.what() ); }
          		catch( const char* S )           { snprintf( B, sizeof(B), "thrown const char*: %s", S ? S : "(null)" ); }
          		catch( int I )                   { snprintf( B, sizeof(B), "thrown int: %d (Unreal appError?)", I ); }
          		catch( ... )                     { snprintf( B, sizeof(B), "unknown exception" ); }
          		char M[800];
          		snprintf( M, sizeof(M), "std::terminate: %s | mem=%uMB | last log line: %s", B, ResidentMB(), GLast );
          		LogLine( "CRASH", M, false );
          		void* Bt[64]; int N = backtrace( Bt, 64 );
          		if( GFd >= 0 ) backtrace_symbols_fd( Bt, N, GFd );
          	}
          	abort();
          }

          static void AtExitHandler( void )
          {
          	LogLine( "host", "process exit (atexit): clean shutdown", false );
          	if( GMarker[0] ) unlink( GMarker );
          }

          #ifdef __OBJC__
          static void ObjCExceptionHandler( NSException* E )
          {
          	MarkerWrite( "crash" );
          	NSString* S = [NSString stringWithFormat:@"Uncaught NSException %@: %@ | last log line: %s | stack: %@", E.name, E.reason, GLast, [E callStackSymbols]];
          	LogLine( "CRASH", [S UTF8String], false );
          }
          #endif

          #ifndef UE_DIAG_TEST
          static const char* SDLCatName( int Cat )
          {
          	static const char* N[] = { "app", "error", "assert", "system", "audio", "video", "render", "input", "test" };
          	return ( Cat >= 0 && Cat < (int)( sizeof(N) / sizeof(N[0]) ) ) ? N[Cat] : "custom";
          }
          static const char* SDLPriName( int Pri )
          {
          	static const char* N[] = { "?", "VERBOSE", "DEBUG", "INFO", "WARN", "ERROR", "CRITICAL" };
          	return ( Pri >= 0 && Pri < (int)( sizeof(N) / sizeof(N[0]) ) ) ? N[Pri] : "?";
          }
          static void SDLCALL SDLLogCB( void*, int Cat, SDL_LogPriority Pri, const char* Msg )
          {
          	char B[1100];
          	snprintf( B, sizeof(B), "%s/%s: %s", SDLCatName( Cat ), SDLPriName( (int)Pri ), Msg ? Msg : "" );
          	LogLine( "sdl", B, true );
          }
          #endif

          #ifdef __APPLE__
          static void DescribeAddr( uintptr_t A, char* B, size_t Cap )
          {
          	Dl_info I;
          	if( dladdr( (void*)A, &I ) && I.dli_fname )
          	{
          		const char* Img = strrchr( I.dli_fname, '/' ); Img = Img ? Img + 1 : I.dli_fname;
          		if( I.dli_sname ) snprintf( B, Cap, "%s+%lu (%s)", I.dli_sname, (unsigned long)( A - (uintptr_t)I.dli_saddr ), Img );
          		else              snprintf( B, Cap, "%s+0x%lx", Img, (unsigned long)( A - (uintptr_t)I.dli_fbase ) );
          	}
          	else snprintf( B, Cap, "0x%lx", (unsigned long)A );
          }
          #endif

          // BEGIN-SAMPLER
          // Hang locator: while the process is silent the heartbeat thread peeks at the MAIN thread's registers and frame chain
          // (armv7: r7 = frame pointer) and logs "function+offset" for each frame -> shows exactly where appInit/InitEngine is stuck.
          // Only raw addresses are collected while the thread is suspended (no malloc / locks / logging), symbolication happens after resume.
          #if defined(__APPLE__) && defined(__arm__)
          #define UE_CAN_SAMPLE 1
          static mach_port_t GMainThread = MACH_PORT_NULL;
          static int SampleMainThread( uintptr_t* Out, int Max )
          {
          	if( GMainThread == MACH_PORT_NULL || Max < 4 ) return 0;
          	int N = 0;
          	if( thread_suspend( GMainThread ) != KERN_SUCCESS ) return 0;
          	arm_thread_state_t S; mach_msg_type_number_t C = ARM_THREAD_STATE_COUNT;
          	if( thread_get_state( GMainThread, ARM_THREAD_STATE, (thread_state_t)&S, &C ) == KERN_SUCCESS )
          	{
          		Out[N++] = (uintptr_t)S.__pc;
          		if( S.__lr ) Out[N++] = (uintptr_t)S.__lr;
          		uintptr_t Fp = (uintptr_t)S.__r[7];
          		for( int i = 0; i < 24 && N < Max && Fp && !( Fp & 3 ); i++ )
          		{
          			uintptr_t Frame[2]; vm_size_t Got = 0;
          			if( vm_read_overwrite( mach_task_self(), (vm_address_t)Fp, sizeof(Frame), (vm_address_t)Frame, &Got ) != KERN_SUCCESS || Got != sizeof(Frame) ) break;
          			if( Frame[1] ) Out[N++] = Frame[1];
          			if( Frame[0] <= Fp ) break;
          			Fp = Frame[0];
          		}
          	}
          	thread_resume( GMainThread );
          	return N;
          }
          #endif
          // END-SAMPLER

          static void* HeartbeatThread( void* )
          {
          	double PrevAt = NowSec(), PrevCpu = CpuSeconds();
          	for( ;; )
          	{
          		const double Up = NowSec() - GStart;
          		for( int Tick = 0; Tick < ( Up < 60 ? 50 : 300 ); Tick++ )
          		{
          			usleep( 100000 );
          			if( GCrashState == 1 )
          			{
          #ifdef __APPLE__
          				char Sym[1500]; size_t O = (size_t)snprintf( Sym, sizeof(Sym), "*** crash symbols:" );
          				for( int i = 0; i < GCrashN && i < 18 && O + 200 < sizeof(Sym); i++ )
          				{
          					char D[160]; DescribeAddr( (uintptr_t)GCrashPcs[i], D, sizeof(D) );
          					O += (size_t)snprintf( Sym + O, sizeof(Sym) - O, " %s%s", i ? "<- " : "", D );
          				}
          				if( O < sizeof(Sym) - 2 ) { Sym[O++] = '\n'; Sym[O] = 0; }
          				RawWrite( Sym );
          #endif
          				GCrashState = 2;
          			}
          		}
          		const double Now = NowSec(), Cpu = CpuSeconds();
          		const int CpuPct = Now > PrevAt ? (int)( ( Cpu - PrevCpu ) / ( Now - PrevAt ) * 100.0 + 0.5 ) : 0;
          		PrevAt = Now; PrevCpu = Cpu;

          		char Last[256]; double LastAt;
          		pthread_mutex_lock( &GLock ); strlcpy( Last, GLast, sizeof(Last) ); LastAt = GLastAt; pthread_mutex_unlock( &GLock );
          		const double Silent = LastAt > 0 ? Now - LastAt : Now - GStart;

          		char Pump[40]; const double P = GMainPumpAt;
          		if( P > 0 ) snprintf( Pump, sizeof(Pump), "%.0fs ago", Now - P ); else snprintf( Pump, sizeof(Pump), "never" );

          		// "silent" = no new log line. Busy CPU + silent = still loading/computing; idle CPU + silent = blocked.
          		const char* Verdict = "ok";
          		if( Silent >= 20.0 ) Verdict = CpuPct < 5 ? "STALLED (no log, CPU idle: blocked / deadlock / waiting on I/O)" : ( CpuPct >= 50 ? "busy (no log, CPU working: loading or looping)" : "slow (no log, low CPU)" );

          		char B[700];
          		snprintf( B, sizeof(B), "+%ds | silent %.0fs | cpu %d%% | mem %uMB | main-loop pumped %s | %s | last: %s",
          			(int)( Now - GStart ), Silent, CpuPct, ResidentMB(), Pump, Verdict, Last );
          		LogLine( "hb", B, false );
          #ifdef UE_CAN_SAMPLE
          		static int Samples = 0;
          		if( Silent >= 3.0 && Samples < 12 )
          		{
          			Samples++;
          			for( int s = 0; s < 3; s++ )
          			{
          				uintptr_t Pc[40]; const int N = SampleMainThread( Pc, 40 );
          				char Buf[1200]; size_t O = (size_t)snprintf( Buf, sizeof(Buf), "main thread sample %d (%d frames):", s + 1, N );
          				for( int i = 0; i < N && i < 12 && O + 200 < sizeof(Buf); i++ )
          				{
          					char D[160]; DescribeAddr( Pc[i], D, sizeof(D) );
          					O += (size_t)snprintf( Buf + O, sizeof(Buf) - O, " %s%s", i ? "<- " : "", D );
          				}
          				LogLine( "hang", Buf, false );
          				usleep( 300000 );
          			}
          		}
          #endif
          #ifdef __OBJC__
          		// The main queue only runs while the main thread pumps its run loop (SDL_PumpEvents), i.e. once the engine is in its main loop.
          		dispatch_async( dispatch_get_main_queue(), ^{ GMainPumpAt = NowSec(); } );
          #endif
          	}
          	return NULL;
          }

          // How did the previous session end? (marker file written at start, removed on clean exit, rewritten as "crash" by the handlers)
          static void ReportPreviousSession( void )
          {
          	if( !GMarker[0] ) return;
          	char Prev[160] = "";
          	int Fd = open( GMarker, O_RDONLY );
          	if( Fd >= 0 )
          	{
          		ssize_t R = read( Fd, Prev, sizeof(Prev) - 1 ); close( Fd );
          		Prev[R > 0 ? R : 0] = 0;
          	}
          	else return; // no marker: previous session exited cleanly (or first run)
          	char B[400];
          	if( !strncmp( Prev, "crash", 5 ) )
          		snprintf( B, sizeof(B), "previous session CRASHED (%.100s) - the CRASH report is above in this log", Prev );
          	else
          		snprintf( B, sizeof(B), "previous session did NOT exit cleanly and left no crash report (%.100s): killed by iOS (low memory/jetsam or watchdog) or force-quit", Prev );
          	for( char* C = B; *C; C++ ) if( *C == '\n' ) *C = ' ';
          	LogLine( "host", B, true );
          }

          #ifdef __OBJC__
          static void HookLifecycle( void )
          {
          	NSArray* Names = [NSArray arrayWithObjects:
          		UIApplicationDidReceiveMemoryWarningNotification,
          		UIApplicationWillResignActiveNotification, UIApplicationDidBecomeActiveNotification,
          		UIApplicationDidEnterBackgroundNotification, UIApplicationWillEnterForegroundNotification,
          		UIApplicationWillTerminateNotification, nil];
          	for( NSString* N in Names )
          	{
          		[[NSNotificationCenter defaultCenter] addObserverForName:N object:nil queue:nil usingBlock:^(NSNotification* Note)
          		{
          			char B[200];
          			snprintf( B, sizeof(B), "%s%s | mem=%uMB", [Note.name isEqualToString:UIApplicationDidReceiveMemoryWarningNotification] ? "MEMORY WARNING: " : "lifecycle: ",
          				[Note.name UTF8String], ResidentMB() );
          			LogLine( "life", B, false );
          		}];
          	}
          }

          static void LogDeviceBanner( void )
          {
          	char Machine[64] = "?"; size_t Sz = sizeof(Machine);
          	sysctlbyname( "hw.machine", Machine, &Sz, NULL, 0 );
          	unsigned long long Mem = (unsigned long long)[NSProcessInfo processInfo].physicalMemory;
          	long long FreeMB = -1;
          	NSDictionary* Fs = [[NSFileManager defaultManager] attributesOfFileSystemForPath:NSHomeDirectory() error:nil];
          	if( Fs ) FreeMB = [[Fs objectForKey:NSFileSystemFreeSize] longLongValue] / ( 1024 * 1024 );
          	CGSize Sb = [UIScreen mainScreen].bounds.size;
          	char H[500];
          	snprintf( H, sizeof(H), "device: %s | iOS %s | RAM %lluMB | cpus %d | screen %.0fx%.0f @%.1fx | free disk %lldMB | pid %d",
          		Machine, [[[UIDevice currentDevice] systemVersion] UTF8String], Mem / ( 1024ull * 1024ull ),
          		(int)[NSProcessInfo processInfo].activeProcessorCount, Sb.width, Sb.height, (double)[UIScreen mainScreen].scale, FreeMB, (int)getpid() );
          	LogLine( "host", H, true );
          	snprintf( H, sizeof(H), "paths: docs=%s | log=%s | engine log=Documents/UnrealTournament/System/UnrealTournament.log", UE1IOSDocumentsDir(), GLogPath );
          	LogLine( "host", H, true );
          }
          #endif

          __attribute__((constructor)) static void UE1IOSDiagInit( void )
          {
          	GStart = NowSec();
          #ifdef UE_CAN_SAMPLE
          	GMainThread = mach_thread_self(); // image initializers run on the main thread
          #endif
          #ifdef __OBJC__
          	@autoreleasepool
          	{
          		pthread_mutex_lock( &GLock ); EnsureOpen(); pthread_mutex_unlock( &GLock );
          		char H[300];
          		snprintf( H, sizeof(H), "\n==== Unreal iOS launch | build %s %s | iOS %s | %s ====",
          			__DATE__, __TIME__, [[[UIDevice currentDevice] systemVersion] UTF8String], [[[UIDevice currentDevice] model] UTF8String] );
          		LogLine( "host", H, true );
          		ReportPreviousSession();
          		LogDeviceBanner();
          		HookLifecycle();
          	}
          #else
          	pthread_mutex_lock( &GLock ); EnsureOpen(); pthread_mutex_unlock( &GLock );
          	LogLine( "host", "==== launch (test build) ====", true );
          	ReportPreviousSession();
          #endif
          	MarkerWrite( "running" );
          	atexit( AtExitHandler );

          	static char AltStack[64 * 1024];
          	stack_t Ss; Ss.ss_sp = AltStack; Ss.ss_size = sizeof(AltStack); Ss.ss_flags = 0;
          	sigaltstack( &Ss, NULL );
          	struct sigaction Sa; memset( &Sa, 0, sizeof(Sa) );
          	Sa.sa_sigaction = CrashHandler;
          	Sa.sa_flags = SA_SIGINFO | SA_ONSTACK | SA_RESETHAND;
          	sigemptyset( &Sa.sa_mask );
          	const int Sigs[] = { SIGSEGV, SIGBUS, SIGILL, SIGABRT, SIGFPE, SIGTRAP };
          	for( size_t i = 0; i < sizeof(Sigs)/sizeof(Sigs[0]); i++ ) sigaction( Sigs[i], &Sa, NULL );
          	std::set_terminate( TerminateHandler );
          #ifdef __OBJC__
          	NSSetUncaughtExceptionHandler( &ObjCExceptionHandler );
          #endif
          #ifndef UE_DIAG_TEST
          	SDL_LogSetAllPriority( SDL_LOG_PRIORITY_INFO );
          	SDL_LogSetOutputFunction( SDLLogCB, NULL );
          #endif
          	pthread_t Th;
          	if( pthread_create( &Th, NULL, HeartbeatThread, NULL ) == 0 ) pthread_detach( Th );
          	LogLine( "host", "diag: crash/exception/SDL handlers + heartbeat installed", true );
          }
          EOF_DIAG
          test -f ios/host/UE1IOSHost.mm
      - name: Generate build files and compat shims (edit THIS yml to change the build)
        run: |
          set -euo pipefail
          cat > ios/cmake/ios-armv7-toolchain.cmake <<'EOF_TC'
          # Toolchain: iOS armv7 (min iOS 7.0) cross-compiled from Linux (Theos LLVM toolchain + iPhoneOS 9.3 SDK).
          set(CMAKE_SYSTEM_NAME Darwin)
          set(IOS TRUE)
          set(CMAKE_SYSTEM_PROCESSOR armv7)
          set(CMAKE_OSX_ARCHITECTURES armv7 CACHE STRING "" FORCE)
          if(NOT IOS_TOOLCHAIN_BIN)
            if(DEFINED ENV{IOS_TOOLCHAIN_BIN})
              set(IOS_TOOLCHAIN_BIN $ENV{IOS_TOOLCHAIN_BIN})
            elseif(DEFINED ENV{THEOS})
              set(IOS_TOOLCHAIN_BIN $ENV{THEOS}/toolchain/linux/iphone/bin)
            endif()
          endif()
          if(NOT IOS_SDK)
            if(DEFINED ENV{IOS_SDK})
              set(IOS_SDK $ENV{IOS_SDK})
            elseif(DEFINED ENV{THEOS})
              set(IOS_SDK $ENV{THEOS}/sdks/iPhoneOS9.3.sdk)
            endif()
          endif()
          if(NOT IOS_TOOLCHAIN_BIN OR NOT IOS_SDK)
            message(FATAL_ERROR "Set THEOS, or IOS_TOOLCHAIN_BIN and IOS_SDK")
          endif()
          set(CMAKE_SYSROOT ${IOS_SDK})
          set(CMAKE_OSX_SYSROOT ${IOS_SDK} CACHE PATH "" FORCE)
          set(CMAKE_C_COMPILER   ${IOS_TOOLCHAIN_BIN}/clang)
          set(CMAKE_CXX_COMPILER ${IOS_TOOLCHAIN_BIN}/clang++)
          set(CMAKE_OBJC_COMPILER   ${IOS_TOOLCHAIN_BIN}/clang)
          set(CMAKE_OBJCXX_COMPILER ${IOS_TOOLCHAIN_BIN}/clang++)
          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_COMPILER_WORKS TRUE)
            set(CMAKE_${L}_COMPILER_TARGET armv7-apple-ios7.0)
          endforeach()
          find_program(IOS_AR     NAMES llvm-ar ar         HINTS ${IOS_TOOLCHAIN_BIN} NO_DEFAULT_PATH)
          find_program(IOS_RANLIB NAMES llvm-ranlib ranlib HINTS ${IOS_TOOLCHAIN_BIN} NO_DEFAULT_PATH)
          find_program(IOS_AR     NAMES llvm-ar ar)
          find_program(IOS_RANLIB NAMES llvm-ranlib ranlib)
          set(CMAKE_AR ${IOS_AR} CACHE FILEPATH "" FORCE)
          set(CMAKE_RANLIB ${IOS_RANLIB} CACHE FILEPATH "" FORCE)
          if(DEFINED ENV{IOS_LD})
            set(_ld "-fuse-ld=$ENV{IOS_LD}")
          endif()
          set(_common "-arch armv7 -miphoneos-version-min=7.0 -isysroot ${IOS_SDK} -fno-modules -fno-implicit-modules -fno-implicit-module-maps -Wno-deprecated-declarations -Wno-error")
          set(CMAKE_C_FLAGS_INIT   "${_common}")
          set(_cxxinc "")
          if(EXISTS ${IOS_SDK}/usr/include/c++/v1)
            set(_cxxinc "-nostdinc++ -isystem ${IOS_SDK}/usr/include/c++/v1")
          endif()
          set(CMAKE_CXX_FLAGS_INIT "${_common} -stdlib=libc++ ${_cxxinc}")
          set(CMAKE_OBJC_FLAGS_INIT   "${_common}")
          set(CMAKE_OBJCXX_FLAGS_INIT "${_common} -stdlib=libc++ ${_cxxinc}")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-arch armv7 -miphoneos-version-min=7.0 -isysroot ${IOS_SDK} ${_ld}")
          set(CMAKE_USER_MAKE_RULES_OVERRIDE ${CMAKE_CURRENT_LIST_DIR}/ios-rules-override.cmake)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(CMAKE_FIND_ROOT_PATH ${IOS_SDK})
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          EOF_TC
          cat > ios/cmake/ios-rules-override.cmake <<'EOF_OV'
          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_CREATE_STATIC_LIBRARY "<CMAKE_AR> qc <TARGET> <LINK_FLAGS> <OBJECTS>" "<CMAKE_RANLIB> <TARGET>")
          endforeach()
          EOF_OV
          cat > CMakeLists.txt <<'EOF_CM'
          cmake_minimum_required(VERSION 3.20)
          project(UT99iOS C CXX OBJC OBJCXX)

          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_CREATE_STATIC_LIBRARY "<CMAKE_AR> qc <TARGET> <LINK_FLAGS> <OBJECTS>" "<CMAKE_RANLIB> <TARGET>")
          endforeach()
          set(CMAKE_POSITION_INDEPENDENT_CODE OFF)
          set(CMAKE_BUILD_TYPE RelWithDebInfo CACHE STRING "")

          # ---- SDL2 2.32.10 (UIKit, static, GLES). SDL audio stays ON: UT99's audio core is SDL-based.
          set(SDL_SHARED OFF CACHE BOOL "" FORCE)
          set(SDL_STATIC ON  CACHE BOOL "" FORCE)
          set(SDL_TEST   OFF CACHE BOOL "" FORCE)
          set(SDL_TESTS  OFF CACHE BOOL "" FORCE)
          set(SDL_METAL  OFF CACHE BOOL "" FORCE)
          set(SDL_RENDER_METAL OFF CACHE BOOL "" FORCE)
          set(SDL_VULKAN OFF CACHE BOOL "" FORCE)
          set(SDL_HAPTIC OFF CACHE BOOL "" FORCE)
          set(SDL_HIDAPI OFF CACHE BOOL "" FORCE)
          set(SDL_OPENGLES ON CACHE BOOL "" FORCE)
          add_subdirectory(build_deps/SDL2 EXCLUDE_FROM_ALL)
          file(MAKE_DIRECTORY ${CMAKE_BINARY_DIR}/sdlinc)
          file(CREATE_LINK ${CMAKE_SOURCE_DIR}/build_deps/SDL2/include ${CMAKE_BINARY_DIR}/sdlinc/SDL2 SYMBOLIC)
          set(SDL2_INCLUDE_DIR "${CMAKE_BINARY_DIR}/sdlinc;${CMAKE_SOURCE_DIR}/build_deps/SDL2/include" CACHE STRING "" FORCE)
          set(SDL2_LIBRARY SDL2-static CACHE STRING "" FORCE)

          # ---- libxmp (tracker music, .umx)
          set(BUILD_STATIC ON CACHE BOOL "" FORCE)
          set(BUILD_SHARED OFF CACHE BOOL "" FORCE)
          set(BUILD_LITE OFF CACHE BOOL "" FORCE)
          set(WITH_UNIT_TESTS OFF CACHE BOOL "" FORCE)
          add_subdirectory(build_deps/libxmp EXCLUDE_FROM_ALL)
          set(LIBXMP_INCLUDE_DIR ${CMAKE_SOURCE_DIR}/build_deps/libxmp/include CACHE STRING "" FORCE)
          add_library(ut99_libxmp INTERFACE)
          target_link_libraries(ut99_libxmp INTERFACE xmp_static)

          # ---- Engine (ut99dc / UE1 v432-class), patched by ios/patch_ut99.py
          set(UE1_IOS_CXX_STD 14 CACHE STRING "C++ standard for the engine (SDK libc++ is old; try 17 if code needs it)")
          add_definitions(-DPLATFORM_IOS -DUNREAL_IOS)
          include_directories(${CMAKE_SOURCE_DIR}/ios/shim)
          add_compile_options("$<$<COMPILE_LANGUAGE:CXX>:SHELL:-include ${CMAKE_SOURCE_DIR}/ios/shim/ue_ios_compat.h>")
          set(USE_SDL ON CACHE BOOL "" FORCE)
          set(LOW_MEMORY ON CACHE BOOL "" FORCE)
          set(BUILD_STATIC ON CACHE BOOL "" FORCE)
          set(BUILD_UNREALTOURNAMENT ON CACHE BOOL "" FORCE)
          set(BUILD_EDITOR OFF CACHE BOOL "" FORCE)
          set(BUILD_DCUTIL OFF CACHE BOOL "" FORCE)
          set(BUILD_NOPENGLDRV OFF CACHE BOOL "" FORCE)
          set(BUILD_NULLSOUNDDRV OFF CACHE BOOL "" FORCE)
          set(BUILD_PVRDRV OFF CACHE BOOL "" FORCE)
          set(BUILD_AICADRV OFF CACHE BOOL "" FORCE)
          add_subdirectory(engine/Source ue1)

          # ---- Host app (UIKit entry via SDL2main, touch UI, config bootstrap)
          add_executable(UT99iOS ios/host/UE1IOSHost.mm ios/host/ios_diag.mm ios/host/ios_availability_stub.m)
          set_source_files_properties(ios/host/UE1IOSHost.mm PROPERTIES COMPILE_OPTIONS "-fobjc-arc")
          target_include_directories(UT99iOS PRIVATE ${SDL2_INCLUDE_DIR})
          # UE1 packages register themselves via static initializers -> force_load each.
          set(UE1_LIBS Core Engine Render Audio IpDrv Fire NSDLDrv NOpenGLESDrv UnrealTournament)
          set(_fl "")
          foreach(t ${UE1_LIBS})
            if(TARGET ${t})
              add_dependencies(UT99iOS ${t})
              list(APPEND _fl "-Wl,-force_load,$<TARGET_FILE:${t}>")
            else()
              message(WARNING "engine target ${t} does not exist")
            endif()
          endforeach()
          target_link_libraries(UT99iOS PRIVATE ${_fl} SDL2main SDL2-static xmp_static
            "-framework UIKit" "-framework Foundation" "-framework OpenGLES"
            "-framework QuartzCore" "-framework CoreGraphics" "-framework AudioToolbox"
            "-framework CoreAudio" "-framework CoreMotion" "-framework CoreFoundation"
            "-framework AVFoundation" "-framework CoreVideo" "-weak_framework GameController"
            "-Wl,-dead_strip" c++)
          set_target_properties(UT99iOS PROPERTIES OUTPUT_NAME UT99iOS)
          EOF_CM
          cat > ios/scripts/package_ios.sh <<'EOF_PK'
          #!/usr/bin/env bash
          # Usage: package_ios.sh <build-dir> [out-dir]  -> UT99iOS.ipa (ldid fake-signed)
          set -euo pipefail
          B="${1:?build dir}"; OUT="${2:-$B/out}"
          R="$(cd "$(dirname "$0")/.." && pwd)"
          BIN="$B/UT99iOS"; [ -f "$BIN" ] || { echo "no $BIN"; exit 1; }
          rm -rf "$OUT/Payload"; APP="$OUT/Payload/UT99iOS.app"; mkdir -p "$APP"
          cp "$BIN" "$APP/UT99iOS"
          cp "$R/resources/Info.plist" "$APP/"
          find "$R/resources" -maxdepth 1 -name '*.png' -exec cp {} "$APP/" \;
          LDID="${LDID:-$(command -v ldid || ls ${THEOS:-/nonexistent}/toolchain/linux/iphone/bin/ldid 2>/dev/null || true)}"
          if [ -n "$LDID" ]; then "$LDID" -S"$R/resources/entitlements.plist" "$APP/UT99iOS"; else echo "warning: ldid not found, binary unsigned"; fi
          (cd "$OUT" && rm -f UT99iOS.ipa && zip -qr UT99iOS.ipa Payload)
          echo "built $OUT/UT99iOS.ipa"
          EOF_PK
          chmod +x ios/scripts/package_ios.sh
          cat > ios/shim/ue_ios_compat.h <<'EOF_SHIM'
          // Force-included into every C++ file of the iOS build (-include).
          // UT99's Android code paths (which iOS reuses: SDL audio, SDL touch, GLES) reference a few Android
          // APIs (JNI / logcat). On iOS the JNI environment simply does not exist: SDL_AndroidGetJNIEnv() returns
          // NULL, and every call site already bails out on a NULL env.
          #ifndef UE_IOS_COMPAT_H
          #define UE_IOS_COMPAT_H
          #ifdef __cplusplus
          #include <stdarg.h>
          #include <stdio.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <sys/time.h>

          #define JNIEXPORT
          #define JNICALL
          #define JNI_TRUE  1
          #define JNI_FALSE 0
          typedef int32_t  jint;
          typedef uint8_t  jboolean;
          typedef float    jfloat;
          typedef int64_t  jlong;
          typedef void*    jobject;
          typedef void*    jclass;
          typedef void*    jstring;
          typedef void*    jmethodID;
          typedef void*    jarray;

          struct JNIEnv_
          {
          	jclass     FindClass( const char* ) { return 0; }
          	jboolean   ExceptionCheck() { return 0; }
          	void       ExceptionClear() {}
          	jmethodID  GetStaticMethodID( jclass, const char*, const char* ) { return 0; }
          	jmethodID  GetMethodID( jclass, const char*, const char* ) { return 0; }
          	void       CallStaticVoidMethod( jclass, jmethodID, ... ) {}
          	jboolean   CallStaticBooleanMethod( jclass, jmethodID, ... ) { return 0; }
          	jint       CallStaticIntMethod( jclass, jmethodID, ... ) { return 0; }
          	jfloat     CallStaticFloatMethod( jclass, jmethodID, ... ) { return 0; }
          	void       CallVoidMethod( jobject, jmethodID, ... ) {}
          	void       DeleteLocalRef( jobject ) {}
          	jstring    NewStringUTF( const char* ) { return 0; }
          	const char* GetStringUTFChars( jstring, jboolean* ) { return ""; }
          	void       ReleaseStringUTFChars( jstring, const char* ) {}
          };
          typedef JNIEnv_ JNIEnv;

          static inline void* SDL_AndroidGetJNIEnv( void ) { return 0; }
          static inline void* SDL_AndroidGetActivity( void ) { return 0; }
          static inline int   SDL_GetAndroidSDKVersion( void ) { return 0; }

          enum { ANDROID_LOG_UNKNOWN = 0, ANDROID_LOG_DEFAULT, ANDROID_LOG_VERBOSE, ANDROID_LOG_DEBUG, ANDROID_LOG_INFO, ANDROID_LOG_WARN, ANDROID_LOG_ERROR, ANDROID_LOG_FATAL };
          // Implemented in ios/host/ios_diag.mm: appends to Documents/ut99_ios.log (stderr is invisible on a device).
          extern "C" void UE1IOSLogTagged( const char* Tag, const char* Msg );
          static inline int __android_log_print( int Prio, const char* Tag, const char* Fmt, ... )
          {
          	char B[1024]; va_list A; va_start( A, Fmt ); vsnprintf( B, sizeof(B), Fmt, A ); va_end( A );
          	char T[48]; // "launch" for UT99Launch, "ERROR:UT99Error" for errors, etc.
          	const char* Src = ( Tag && !strcmp( Tag, "UT99Launch" ) ) ? "launch" : ( Tag ? Tag : "ut99" );
          	snprintf( T, sizeof(T), "%s%s", Prio >= ANDROID_LOG_ERROR ? "ERR:" : "", Src );
          	UE1IOSLogTagged( T, B );
          	fprintf( stderr, "[%s] %s\n", Tag ? Tag : "ut99", B );
          	return 0;
          }
          #endif
          #endif
          EOF_SHIM
          printf '#include "../ue_ios_compat.h"\n' > ios/shim/android/log.h
          printf '#include "ue_ios_compat.h"\n' > ios/shim/jni.h
          cat > ios/patch_ut99.py <<'EOF_PY'
          #!/usr/bin/env python3
          # Applies all iOS (armv7, iOS 7+) source changes to the UT99 (ut99dc) tree staged in ./engine/Source,
          # the SDL2 tree in ./build_deps/SDL2 and the glad shim in ./android_glad_compat.
          # Every patch reports when its anchor was NOT found, so a source update that breaks a patch is visible in the log.
          import re, sys, pathlib
          ENC = dict(encoding="utf-8", errors="surrogateescape")
          E = pathlib.Path("engine/Source")
          SDL = pathlib.Path("build_deps/SDL2")
          problems = []

          def rd(p): return pathlib.Path(p).read_text(**ENC)
          def wr(p, t): pathlib.Path(p).write_text(t, **ENC)

          def sub(path, old, new, count=0, rx=False, must=True, flags=0):
              p = pathlib.Path(path)
              if not p.exists():
                  if must: problems.append(f"missing file {path}")
                  return 0
              t = rd(p)
              if rx: t2, n = re.subn(old, new, t, count=count, flags=flags)
              else:
                  n = t.count(old)
                  if count and n > count: n = count
                  t2 = t.replace(old, new, count) if count else t.replace(old, new)
              if n == 0 and must: problems.append(f"anchor not found in {path}: {old[:70]!r}")
              if t2 != t: wr(p, t2)
              return n

          # ---------------------------------------------------------------- 1. Android guards -> also true on iOS
          IOS = "defined(PLATFORM_IOS)"
          def flip(t):
              t = re.sub(r'#[ \t]*ifdef[ \t]+(PLATFORM_ANDROID|__ANDROID__|UNREAL_ANDROID)\b', rf'#if defined(\1) || {IOS}', t)
              t = re.sub(r'#[ \t]*ifndef[ \t]+(PLATFORM_ANDROID|__ANDROID__|UNREAL_ANDROID)\b', rf'#if !defined(\1) && !{IOS}', t)
              t = re.sub(r'#[ \t]*if[ \t]+PLATFORM_ANDROID\b(?![ \t]*\|\|)', rf'#if PLATFORM_ANDROID || {IOS}', t)
              t = re.sub(r'(?<![\w(])defined[ \t]*\([ \t]*(PLATFORM_ANDROID|__ANDROID__|UNREAL_ANDROID)[ \t]*\)(?![ \t]*\|\|[ \t]*defined\(PLATFORM_IOS\))', rf'(defined(\1) || {IOS})', t)
              # Darwin has no <malloc.h>
              t = re.sub(r'#[ \t]*include[ \t]*<malloc\.h>', '#ifndef __APPLE__\n#include <malloc.h>\n#endif', t)
              return t
          skip_dirs = {"Editor", "UnrealEd", "DCUtil", "KOSDrv", "PVRDrv", "AICADrv", "UCC", "UWeb", "IpServer", "Thirdparty"}
          nfiles = 0
          for p in E.rglob("*"):
              if p.suffix.lower() not in (".cpp", ".h", ".inc", ".c") or not p.is_file(): continue
              if p.relative_to(E).parts[0] in skip_dirs: continue
              t = rd(p); t2 = flip(t)
              if t2 != t: wr(p, t2); nfiles += 1
          print(f"guards flipped in {nfiles} files")

          # ---------------------------------------------------------------- 2. CMake
          sub(E/"CMakeLists.txt", "list(APPEND CMAKE_MODULE_PATH ${CMAKE_SOURCE_DIR}/cmake)", "list(APPEND CMAKE_MODULE_PATH ${CMAKE_CURRENT_SOURCE_DIR}/cmake)")
          sub(E/"CMakeLists.txt", "set(CMAKE_CXX_STANDARD 17)", "if(IOS)\n  set(CMAKE_CXX_STANDARD ${UE1_IOS_CXX_STD})\nelse()\n  set(CMAKE_CXX_STANDARD 17)\nendif()")
          sub(E/"CMakeLists.txt", "elseif(LOW_MEMORY AND NOT ANDROID)", "elseif(LOW_MEMORY AND NOT ANDROID AND NOT IOS)")
          # armv7 in the OS X arch detection
          sub(E/"cmake/TargetArch.cmake", '            elseif("${osx_arch}" STREQUAL "arm64")\n                set(osx_arch_arm64 TRUE)\n',
              '            elseif("${osx_arch}" STREQUAL "arm64")\n                set(osx_arch_arm64 TRUE)\n            elseif("${osx_arch}" STREQUAL "armv7")\n                set(osx_arch_armv7 TRUE)\n')
          sub(E/"cmake/TargetArch.cmake", '        if(osx_arch_arm64)\n            list(APPEND ARCH arm64)\n        endif()\n',
              '        if(osx_arch_arm64)\n            list(APPEND ARCH arm64)\n        endif()\n\n        if(osx_arch_armv7)\n            list(APPEND ARCH armv7)\n        endif()\n')
          # GLES: use the Android glad/glm shims (GLES2 symbols are linked directly)
          sub(E/"NOpenGLESDrv/CMakeLists.txt", "if(ANDROID)\n  set(ANDROID_GLAD_COMPAT_DIR", "if(ANDROID OR IOS)\n  set(ANDROID_GLAD_COMPAT_DIR", count=1)
          # Audio: SDL audio + libxmp (alias target ut99_libxmp is created by the top-level CMakeLists)
          sub(E/"Audio/CMakeLists.txt", "if(ANDROID)\n  target_include_directories", "if(ANDROID OR IOS)\n  target_include_directories", count=1)
          # Launcher: static library on iOS (the host executable force-loads every package)
          sub(E/"UnrealTournament/CMakeLists.txt", "if(ANDROID)\n  add_library(${PROJECT_NAME} SHARED ${SRC_FILES})",
              "if(IOS)\n  add_library(${PROJECT_NAME} STATIC ${SRC_FILES})\nelseif(ANDROID)\n  add_library(${PROJECT_NAME} SHARED ${SRC_FILES})")
          sub(E/"UnrealTournament/CMakeLists.txt", "    target_link_libraries(${PROJECT_NAME} -Wl,--whole-archive ${LINK_PACKAGES} -Wl,--no-whole-archive)",
              "    if(IOS)\n      target_link_libraries(${PROJECT_NAME} ${LINK_PACKAGES})\n    else()\n      target_link_libraries(${PROJECT_NAME} -Wl,--whole-archive ${LINK_PACKAGES} -Wl,--no-whole-archive)\n    endif()")

          # ---------------------------------------------------------------- 3. Core / misc Darwin fixes
          sub(E/"Core/Src/UnGUID.cpp", r'\buuid_t\b', 'ue_uuid_t', rx=True, must=False)
          sub(E/"Core/Src/UnGUID.cpp", r'\buuid_create\b', 'ue_uuid_create', rx=True, must=False)
          sub(E/"Core/Src/UnGUID.cpp", r'\buuid_init\b', 'ue_uuid_init', rx=True, must=False)
          # iOS < 10 has no clock_gettime()
          sub(E/"Core/Inc/UT99LoadProfiler.h", "clock_gettime(CLOCK_MONOTONIC, &Ts);",
              "{ struct timeval UeTv; gettimeofday(&UeTv, 0); Ts.tv_sec = UeTv.tv_sec; Ts.tv_nsec = UeTv.tv_usec * 1000; }", must=False)
          # Apple's pthread_setname_np takes 1 arg
          for f in (E/"Core/Src/UnThread.cpp",):
              if f.exists(): sub(f, "#include \"CorePrivate.h\"", "#include \"CorePrivate.h\"\n#if defined(__APPLE__)\n#undef pthread_setname_np\n#define pthread_setname_np(t, n) do { } while(0)\n#endif", count=1, must=False)

          # ---------------------------------------------------------------- 4. Launcher: data dir bootstrap (Documents/UnrealTournament)
          BOOT = r'''
          #ifdef PLATFORM_IOS
          #include <errno.h>
          #include <sys/stat.h>
          #include <unistd.h>
          // Implemented in ios/host (UE1IOSHost.mm / ios_diag.mm)
          extern "C" const char* UE1IOSDocumentsDir();
          extern "C" void UE1IOSLog( const char* Msg );
          extern "C" void UE1IOSPrepareConfig( const char* SystemDir );
          static int UT99IOSDirExists( const char* P ) { struct stat St; return stat( P, &St ) == 0 && S_ISDIR( St.st_mode ); }
          static void UT99IOSEarlyError( const char* Msg )
          {
          	UE1IOSLog( Msg );
          	SDL_ShowSimpleMessageBox( SDL_MESSAGEBOX_ERROR, "Unreal Tournament", Msg, NULL );
          	exit( 1 );
          }
          // Game data lives in <App>/Documents/UnrealTournament/{System,Maps,Textures,Sounds,Music} (iTunes File Sharing / Filza).
          static void UT99IOSPreInit()
          {
          	const char* Docs = UE1IOSDocumentsDir();
          	if( !Docs || !Docs[0] ) UT99IOSEarlyError( "Could not resolve the app Documents folder." );
          	static char Root[1024], Sys[1100];
          	snprintf( Root, sizeof(Root), "%s/UnrealTournament", Docs );
          	snprintf( Sys, sizeof(Sys), "%s/System", Root );
          	if( !UT99IOSDirExists( Sys ) )
          	{
          		snprintf( Root, sizeof(Root), "%s", Docs );
          		snprintf( Sys, sizeof(Sys), "%s/System", Root );
          		if( !UT99IOSDirExists( Sys ) )
          			UT99IOSEarlyError( "UT99 game data not found.\n\nCopy your Unreal Tournament folders (System, Maps, Textures, Sounds, Music) into the app's Documents/UnrealTournament folder (iTunes File Sharing / Filza)." );
          	}
          	setenv( "HOME", Root, 1 );
          	static char Base[1120]; snprintf( Base, sizeof(Base), "%s/", Sys );
          	setenv( "UT99_ANDROID_BASEDIR", Base, 1 ); // appBaseDir() honours this variable
          	if( chdir( Sys ) < 0 ) UT99IOSEarlyError( "Could not chdir into the System folder." );
          	UE1IOSPrepareConfig( Sys );
          	UE1IOSLog( "UT99 iOS: data root ready" );
          }
          #endif
          '''
          n = sub(E/"UnrealTournament/Src/Launch.cpp", r'(\n)(int main\( int argc, char\* argv\[\] \)\n\{)', lambda m: "\n" + BOOT + "\n" + m.group(2) + "\n#ifdef PLATFORM_IOS\n\tUT99IOSPreInit();\n#endif", rx=True, count=1)

          # ---------------------------------------------------------------- 4b. Mirror every engine debugf()/appError() line into Documents/ut99_ios.log
          # (ios_diag.mm documents this mirror, but no patch ever installed it: after "data root ready" the host log went silent
          #  and a hang/slow load was impossible to localise. The engine only wrote System/UnrealTournament.log.)
          FOD = E/"Core/Inc/FOutputDeviceFile.h"
          sub(FOD, "class FOutputDeviceFile : public FOutputDevice\n{",
              '#ifdef PLATFORM_IOS\nextern "C" void UE1IOSLogTagged( const char* Tag, const char* Msg );\n#endif\nclass FOutputDeviceFile : public FOutputDevice\n{', count=1)
          sub(FOD, "\t\t\t\tif( GLogHook )\n\t\t\t\t\tGLogHook->Serialize( Data, Event );",
              '#if defined(PLATFORM_IOS) && !UNICODE\n\t\t\t\tif( Event!=NAME_Title )\n\t\t\t\t{\n\t\t\t\t\tchar Msg[1200]; snprintf( Msg, sizeof(Msg), "%s: %s", FName::SafeString(Event), Data ? Data : "" );\n\t\t\t\t\tUE1IOSLogTagged( "engine", Msg );\n\t\t\t\t}\n#endif\n\t\t\t\tif( GLogHook )\n\t\t\t\t\tGLogHook->Serialize( Data, Event );', count=1)

          # ---------------------------------------------------------------- 4c. statement-level trace of the engine start-up -> ut99_ios.log (tag "init")
          # The first iPad logs stopped inside appInit (CPU busy, 11 MB resident). Instead of guessing, EVERY top-level statement of
          # appInit / FName::StaticInit / UObject::StaticInit / UObject::ProcessRegistrants now logs "<func>> <statement>" after it ran,
          # so the last "init" line in the log is the last statement that finished and the next one in the source is where it is stuck.
          def trace_func(path, header_rx, tag, must=True):
              p = pathlib.Path(path)
              if not p.exists():
                  if must: problems.append(f"trace: missing file {path}")
                  return
              t = rd(p)
              m = re.search(header_rx, t)
              if not m:
                  if must: problems.append(f"trace: function not found: {tag}")
                  return
              start = m.end()
              end = t.index("\n}\n", start)
              out, n = [], 0
              for ln in t[start:end].split("\n"):
                  out.append(ln)
                  s = ln.strip()
                  if (ln.startswith("\t") and not ln.startswith("\t\t") and s.endswith(";")
                          and not s.startswith(("//", "#", "/*", "return", "unguard", "break", "continue", "goto"))
                          and ln.count("(") == ln.count(")") and ln.count("{") == ln.count("}")):
                      txt = s[:60].replace("\\", "/").replace('"', "'").replace("%", "pct")
                      out.append('#ifdef PLATFORM_IOS\n\tUE1IOSLogTagged( "init", "%s> %s" );\n#endif' % (tag, txt))
                      n += 1
              wr(p, t[:start] + "\n".join(out) + t[end:])
              print(f"trace: {tag}: {n} checkpoints")
          trace_func(E/"Core/Src/UnMisc.cpp", r"CORE_API void appInit\([^\n]*\)\n\{\n", "appInit")
          trace_func(E/"Core/Src/UnName.cpp", r"void FName::StaticInit\(\)\n\{\n", "FName::StaticInit")
          trace_func(E/"Core/Src/UnObj.cpp", r"void UObject::StaticInit\(\)\n\{\n", "UObject::StaticInit")
          trace_func(E/"Core/Src/UnObj.cpp", r"void UObject::ProcessRegistrants\(\)\n\{\n", "ProcessRegistrants")
          # markers that sit inside / before the loops, which the per-statement trace cannot reach
          def mark(path, anchor, msg):
              sub(path, anchor, '#ifdef PLATFORM_IOS\n\tUE1IOSLogTagged( "init", "' + msg + '" );\n#endif\n' + anchor, count=1)
          mark(E/"Core/Src/UnMisc.cpp", "\t// Init log table.\n", "appInit> CRC table built")
          mark(E/"Core/Src/UnMisc.cpp", "\t// Command line.\n\t#if _MSC_VER", "appInit> log table built")
          mark(E/"Core/Src/UnName.cpp", "\t#include \"UnNames.h\"\n", "FName::StaticInit> registering hardcoded names...")
          mark(E/"Core/Src/UnName.cpp", "\t// Verify no duplicate names.\n", "FName::StaticInit> hardcoded names registered, checking duplicates...")
          # last crash was a signal right after "GMalloc = InMalloc;": print what GMalloc actually is before the virtual call
          sub(E/"Core/Src/UnMisc.cpp", "\tGMalloc->Init();\n",
              '#ifdef PLATFORM_IOS\n\t{ char M[240]; void** Vt = GMalloc ? *(void***)GMalloc : 0; snprintf( M, sizeof(M), "appInit> about to call GMalloc->Init(): GMalloc=%p vtable=%p", (void*)GMalloc, (void*)Vt ); UE1IOSLogTagged( "init", M ); }\n#endif\n\tGMalloc->Init();\n', count=1)
          # the very first debugf() opens System/UnrealTournament.log: trace that too
          FOD = E/"Core/Inc/FOutputDeviceFile.h"
          sub(FOD, "\t\t\t\t\t// Open log file.\n",
              '#ifdef PLATFORM_IOS\n\t\t\t\t\t{ char M[1200]; snprintf( M, sizeof(M), "FOutputDeviceFile: opening %s", Filename ); UE1IOSLogTagged( "init", M ); }\n#endif\n\t\t\t\t\t// Open log file.\n', count=1)
          sub(FOD, "\t\t\t\t\telse Dead = 1;\n",
              '\t\t\t\t\telse Dead = 1;\n#ifdef PLATFORM_IOS\n\t\t\t\t\tUE1IOSLogTagged( "init", LogAr ? "FOutputDeviceFile: log file opened" : "FOutputDeviceFile: log file open FAILED" );\n#endif\n', count=1)

          # ---------------------------------------------------------------- 5. NSDLClient: iOS SDL hints
          sub(E/"NSDLDrv/Src/NSDLClient.cpp", r'([ \t]*if \( SDL_Init\( SDL_INIT_VIDEO)',
              '#ifdef PLATFORM_IOS\n\tSDL_SetHint( SDL_HINT_ACCELEROMETER_AS_JOYSTICK, "0" );\n\tSDL_SetHint( SDL_HINT_ORIENTATIONS, "LandscapeLeft LandscapeRight" );\n\tSDL_SetHint( SDL_HINT_JOYSTICK_ALLOW_BACKGROUND_EVENTS, "1" );\n#endif\n\\1', rx=True, count=1)

          # ---------------------------------------------------------------- 6. NSDLViewport: touch-look / UI-state bridge to the iOS host, window flags
          VP = E/"NSDLDrv/Src/NSDLViewport.cpp"
          sub(VP, '#include "NSDLDrv.h"', '''#include "NSDLDrv.h"
          #ifdef PLATFORM_IOS
          // Implemented in ios/host (UE1IOSHost.mm)
          extern "C" void UE1IOSSetUIState( int InMenu, int Typing );
          // Touch-look deltas (finger points, +Y = finger down) from the UI thread; consumed once per input tick.
          static SDL_SpinLock GIOSLookLock = 0;
          static FLOAT GIOSLookX = 0.0f;
          static FLOAT GIOSLookY = 0.0f;
          extern "C" void UE1IOSPushLook( float DX, float DY )
          {
          	SDL_AtomicLock( &GIOSLookLock );
          	GIOSLookX += DX;
          	GIOSLookY += DY;
          	SDL_AtomicUnlock( &GIOSLookLock );
          }
          #endif''', count=1)
          sub(VP, "    GUT99RetroTouchUiState = UT99RetroTouchDetermineUiState( Viewport, bMenu );\n",
              "    GUT99RetroTouchUiState = UT99RetroTouchDetermineUiState( Viewport, bMenu );\n#ifdef PLATFORM_IOS\n    UE1IOSSetUIState( bMenu ? 1 : 0, 0 ); // host hides its on-screen pad in menus\n#endif\n", count=1)
          sub(VP, "    // UT99_ANDROID_CONTROLLER_FULL_REMAP_V120:\n    // Do not additionally inject MouseX/MouseY",
              '''#ifdef PLATFORM_IOS
              {
                  FLOAT LookX, LookY;
                  SDL_AtomicLock( &GIOSLookLock );
                  LookX = GIOSLookX; LookY = GIOSLookY;
                  GIOSLookX = 0.0f; GIOSLookY = 0.0f;
                  SDL_AtomicUnlock( &GIOSLookLock );
                  if( LookX != 0.0f || LookY != 0.0f )
                  {
                      const FLOAT Dx = Clamp( LookX, -240.0f, 240.0f );
                      const FLOAT Dy = Clamp( -LookY, -240.0f, 240.0f );
                      if( Dx != 0.0f ) UT99V47Event( Viewport, IK_MouseX, IST_Axis, Dx );
                      if( Dy != 0.0f ) UT99V47Event( Viewport, IK_MouseY, IST_Axis, Dy );
                  }
              }
          #endif
              // UT99_ANDROID_CONTROLLER_FULL_REMAP_V120:
              // Do not additionally inject MouseX/MouseY''', count=1)
          sub(VP, 'hWnd = SDL_CreateWindow( "", OpenX, OpenY, NewX, NewY, Flags );',
              '''#ifdef PLATFORM_IOS
          \t\t\tFlags |= SDL_WINDOW_FULLSCREEN | SDL_WINDOW_BORDERLESS; // iOS windows are always fullscreen; no HIGHDPI on purpose (A5-class GPUs)
          #endif
          \t\t\thWnd = SDL_CreateWindow( "", OpenX, OpenY, NewX, NewY, Flags );''')

          # ---------------------------------------------------------------- 7. NOpenGLESDrv: real renderbuffer size, BGRA upload, GLES log shims
          GL = E/"NOpenGLESDrv/NOpenGLESDrv.cpp"
          sub(GL, "IMPLEMENT_CLASS(UNOpenGLESRenderDevice);", '''IMPLEMENT_CLASS(UNOpenGLESRenderDevice);
          #ifdef PLATFORM_IOS
          static GLint UE1IOSRealW = 0, UE1IOSRealH = 0; // true size of the on-screen renderbuffer
          static int UE1IOSGetDrawable( SDL_Window* W, int* OutW, int* OutH )
          {
          	static Uint32 LastCheck = 0;
          	Uint32 Now = SDL_GetTicks();
          	if( LastCheck == 0 || Now - LastCheck > 250 )
          	{
          		LastCheck = Now | 1;
          		GLint Fbo = 0, Rb = 0, PrevRb = 0, RW = 0, RH = 0;
          		glGetIntegerv( GL_FRAMEBUFFER_BINDING, &Fbo );
          		if( Fbo )
          		{
          			glGetFramebufferAttachmentParameteriv( GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_FRAMEBUFFER_ATTACHMENT_OBJECT_NAME, &Rb );
          			if( Rb )
          			{
          				glGetIntegerv( GL_RENDERBUFFER_BINDING, &PrevRb );
          				glBindRenderbuffer( GL_RENDERBUFFER, (GLuint)Rb );
          				glGetRenderbufferParameteriv( GL_RENDERBUFFER, GL_RENDERBUFFER_WIDTH, &RW );
          				glGetRenderbufferParameteriv( GL_RENDERBUFFER, GL_RENDERBUFFER_HEIGHT, &RH );
          				glBindRenderbuffer( GL_RENDERBUFFER, (GLuint)PrevRb );
          			}
          		}
          		if( RW > 0 && RH > 0 && ( RW != UE1IOSRealW || RH != UE1IOSRealH ) )
          		{
          			debugf( NAME_Log, "GLES: iOS size change: renderbuffer %ix%i -> %ix%i", (int)UE1IOSRealW, (int)UE1IOSRealH, (int)RW, (int)RH );
          			UE1IOSRealW = RW; UE1IOSRealH = RH;
          		}
          	}
          	if( UE1IOSRealW > 0 && UE1IOSRealH > 0 ) { *OutW = UE1IOSRealW; *OutH = UE1IOSRealH; return 0; }
          	return SDL_GL_GetDrawableSize( W, OutW, OutH ), 0;
          }
          #define SDL_GL_GetDrawableSize UE1IOSGetDrawable
          #endif''', count=1)
          sub(GL, r'glTexImage2D\( GL_TEXTURE_2D, (\w+), UploadFormat,',
              r'glTexImage2D( GL_TEXTURE_2D, \1, ( UploadFormat == GL_BGRA_EXT && !GLAD_GL_EXT_texture_format_BGRA8888 ) ? (GLint)GL_RGBA : (GLint)UploadFormat,', rx=True, must=False)
          # glad shim: Apple's GLES headers
          sub("android_glad_compat/glad.h", "#include <GLES2/gl2.h>\n#include <GLES2/gl2ext.h>",
              "#ifdef __APPLE__\n#include <OpenGLES/ES2/gl.h>\n#include <OpenGLES/ES2/glext.h>\n#else\n#include <GLES2/gl2.h>\n#include <GLES2/gl2ext.h>\n#endif")

          # ---------------------------------------------------------------- 8. SDL 2.32.10 for iOS 7 / 9.3 SDK (same fixes as the Unreal 98 port)
          if SDL.exists():
              sub(SDL/"src/misc/ios/SDL_sysurl.m", "openURL:nsurl options:@{} completionHandler:^(BOOL success) {}", "openURL:nsurl")
              sub(SDL/"src/video/uikit/SDL_uikitappdelegate.m", "#include <AvailabilityVersions.h>\n", "")
              sub(SDL/"src/video/uikit/SDL_uikitviewcontroller.m", "[viewcontroller setNeedsUpdateOfHomeIndicatorAutoHidden];", "[viewcontroller performSelector:@selector(setNeedsUpdateOfHomeIndicatorAutoHidden)];")
              sub(SDL/"src/video/uikit/SDL_uikitviewcontroller.m", "[viewcontroller setNeedsUpdateOfScreenEdgesDeferringSystemGestures];", "[viewcontroller performSelector:@selector(setNeedsUpdateOfScreenEdgesDeferringSystemGestures)];")
              sub(SDL/"src/video/uikit/SDL_uikitviewcontroller.m", "        if (@available(iOS 15.0, tvOS 15.0, *)) {", "#if __IPHONE_OS_VERSION_MAX_ALLOWED >= 150000\n        if (@available(iOS 15.0, tvOS 15.0, *)) {", count=1)
              sub(SDL/"src/video/uikit/SDL_uikitviewcontroller.m", r'(\n#if __IPHONE_OS_VERSION_MAX_ALLOWED >= 150000\n        if \(@available\(iOS 15\.0, tvOS 15\.0, \*\)\) \{.*?\n        \}\n)', r'\1#endif\n', rx=True, count=1, flags=re.S)
              sub(SDL/"src/video/uikit/SDL_uikitwindow.m", "scale = windata.uiwindow.screen.nativeScale;", "scale = [windata.uiwindow.screen respondsToSelector:@selector(nativeScale)] ? windata.uiwindow.screen.nativeScale : windata.uiwindow.screen.scale;")
              sub(SDL/"src/video/uikit/SDL_uikitmodes.m", "float scale = (float)screen.nativeScale;", "float scale = (float)([screen respondsToSelector:@selector(nativeScale)] ? screen.nativeScale : screen.scale);")
              # no MFi joystick driver (GameController is weak-linked and absent from old iOS): dummy joystick + the symbol uikitview needs
              sub(SDL/"src/joystick/SDL_joystick.c", "#if (defined(__MACOSX__) || defined(__IPHONEOS__) || defined(__TVOS__)) && !defined(SDL_JOYSTICK_DISABLED)\n    &SDL_IOS_JoystickDriver,\n#endif\n", "")
              t = rd(SDL/"src/joystick/SDL_joystick.c")
              if "SDL_AppleTVRemoteOpenedAsJoystick = 0" not in t: wr(SDL/"src/joystick/SDL_joystick.c", t + "\nint SDL_AppleTVRemoteOpenedAsJoystick = 0;\n")
              sub(SDL/"CMakeLists.txt", "  if(MACOS)\n    set(SDL_FRAMEWORK_COCOA 1)", "  if(MACOS AND NOT IOS)\n    set(SDL_FRAMEWORK_COCOA 1)")
              sub(SDL/"CMakeLists.txt", "      file(GLOB JOYSTICK_SOURCES ${SDL2_SOURCE_DIR}/src/joystick/steam/*.c)\n      set(SDL_JOYSTICK_MFI 1)\n",
                  "      file(GLOB JOYSTICK_SOURCES ${SDL2_SOURCE_DIR}/src/joystick/steam/*.c ${SDL2_SOURCE_DIR}/src/joystick/dummy/*.c)\n      set(SDL_JOYSTICK_DUMMY 1)\n      set(MFI_JOYSTICK_SOURCES \"\")\n")
              sub(SDL/"CMakeLists.txt", "Coremotion", "CoreMotion", must=False)
              # CoreAudio: AVAudioSession options/mode API is newer than the 9.3 SDK -> numeric values + the old setCategory:error:
              CA = SDL/"src/audio/coreaudio/SDL_coreaudio.m"
              sub(CA, "AVAudioSessionCategoryOptionAllowBluetoothA2DP |\n                       AVAudioSessionCategoryOptionAllowAirPlay;", "0x20 /* A2DP */ | 0x40 /* AirPlay */;")
              sub(CA, "[session setCategory:category mode:mode options:options error:&err]", "[session setCategory:category error:&err]")
          else:
              problems.append("SDL2 tree missing")

          print("---- patch report ----")
          for p in problems: print("PROBLEM:", p)
          print("problems:", len(problems))
          sys.exit(0)
          EOF_PY
          python3 ios/patch_ut99.py 2>&1 | tee build-patch.log
          ! grep -q '^PROBLEM' build-patch.log
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build curl zip unzip xz-utils bzip2 git
      - name: Theos + toolchain + SDK
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/tc.tar.xz
          tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          curl -fsSL -o /tmp/sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            [ -f "$fw/module.map" ] && { mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; }
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done
          # toolchain's ar/ranlib wrappers call a missing aarch64-apple-darwin14-ranlib -> make it exist
          TB="$THEOS/toolchain/linux/iphone/bin"
          for t in ranlib; do
            [ -e "$TB/aarch64-apple-darwin14-$t" ] || ln -sf "$TB/llvm-$t" "$TB/aarch64-apple-darwin14-$t" 2>/dev/null || true
          done
          ls "$TB" | grep -E 'llvm-(ar|ranlib)$|ranlib' || true
          echo "== libc++ discovery"
          find "$SDK/usr/include" -maxdepth 2 -iname '*c++*' 2>/dev/null | head
          find "$THEOS/toolchain" -name '__config_site' 2>/dev/null | head
          CS="$TB/../include/c++/v1/__config_site"
          if [ -d "$SDK/usr/include/c++/v1" ]; then echo "SDK libc++ headers: ok"
          elif [ ! -f "$CS" ]; then
            FOUND="$(find "$THEOS/toolchain" -name '__config_site' 2>/dev/null | head -n1)"
            if [ -n "$FOUND" ]; then cp "$FOUND" "$CS"; else
              echo "no __config_site anywhere; writing one (libc++ 19, Apple, pthread)"
              cat > "$CS" <<'EOF_CS'
          #ifndef _LIBCPP_CONFIG_SITE
          #define _LIBCPP_CONFIG_SITE
          #define _LIBCPP_ABI_VERSION 1
          #define _LIBCPP_ABI_NAMESPACE __1
          #define _LIBCPP_HAS_THREAD_API_PTHREAD 1
          #define _LIBCPP_HARDENING_MODE_DEFAULT _LIBCPP_HARDENING_MODE_NONE
          #define _LIBCPP_PSTL_BACKEND_SERIAL 1
          #endif
          EOF_CS
            fi
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Toolchain sanity (shows the real compiler error)
        run: |
          B="$THEOS/toolchain/linux/iphone/bin"; SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          ls "$B" | head -50; ls "$SDK" | head
          printf '#include <fcntl.h>\n#include <pthread.h>\n#include <math.h>\nint main(void){pthread_attr_t t;pthread_attr_init(&t);return (int)tan(1.0)+O_CLOEXEC;}\n' > /tmp/t.c
          echo "== compile (cmake-style flags)"; "$B/clang" --target=armv7-apple-ios7.0 -arch armv7 -miphoneos-version-min=7.0 -isysroot "$SDK" -fno-modules -c /tmp/t.c -o /tmp/t.o -v || true
          echo "== archive"; "$B/llvm-ar" qc /tmp/t.a /tmp/t.o && echo archive-ok || true
          ls -la /tmp/t.o /tmp/t.a || true
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=ios/cmake/ios-armv7-toolchain.cmake 2>&1 | tee build-configure.log || {
            echo "::group::CMakeError.log"; tail -n 120 build/CMakeFiles/CMakeError.log || true; echo "::endgroup::"
            cp build/CMakeFiles/CMakeError.log build-cmakeerror.log 2>/dev/null || true
            exit 1; }
      - name: Build (keeps going to list ALL errors in one run)
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" -- -k 0 2>&1 | tee build-make.log
      - name: Verify Mach-O
        run: |
          file build/UT99iOS || true
          "$THEOS"/toolchain/linux/iphone/bin/*otool* -hv build/UT99iOS | head || true
      - name: Package
        run: ios/scripts/package_ios.sh build build/out
      - uses: actions/upload-artifact@v4
        with: { name: UT99-armv7-iOS, path: build/out/UT99iOS.ipa, if-no-files-found: error }
      - name: Package .deb (jailbreak, installs to /Applications)
        run: |
          set -euo pipefail
          APP=build/out/Payload/UT99iOS.app
          D=build/out/deb; rm -rf "$D"; mkdir -p "$D/DEBIAN" "$D/Applications"
          cp -a "$APP" "$D/Applications/UT99iOS.app"
          chmod 755 "$D/Applications/UT99iOS.app/UT99iOS"
          printf 'Package: com.example.ut99.armv7\nName: Unreal Tournament 99\nVersion: 0.1.0\nArchitecture: iphoneos-arm\nDescription: Unreal Tournament 99 (ut99dc / UE1) for iOS armv7\nMaintainer: ut99-ios\nAuthor: ut99-ios\nSection: Games\nDepends: firmware (>= 7.0)\n' > "$D/DEBIAN/control"
          printf '#!/bin/sh\n(uicache -p /Applications/UT99iOS.app || uicache) >/dev/null 2>&1 || true\nexit 0\n' > "$D/DEBIAN/postinst"
          printf '#!/bin/sh\n(uicache) >/dev/null 2>&1 || true\nexit 0\n' > "$D/DEBIAN/postrm"
          chmod 755 "$D/DEBIAN/postinst" "$D/DEBIAN/postrm"
          dpkg-deb --root-owner-group -Zgzip -b "$D" build/out/UT99iOS_0.1.0_iphoneos-arm.deb
          dpkg-deb -I build/out/UT99iOS_0.1.0_iphoneos-arm.deb
      - uses: actions/upload-artifact@v4
        with: { name: UT99-armv7-iOS-deb, path: build/out/UT99iOS_0.1.0_iphoneos-arm.deb, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-logs, path: "build-*.log", if-no-files-found: ignore }
